<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IsoNim Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- RS-M13b: render-tree CSS bundles for GPUI / Freya DOM
         previews. The editor-build copies render_styles/ alongside
         the editor bundle. -->
    <link rel="stylesheet" href="render_styles/gpui.css" />
    <link rel="stylesheet" href="render_styles/freya.css" />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script src="fabric.min.js"></script>
    <script src="paper-core.min.js"></script>
    <script type="module" src="svgo.browser.js"></script>
    <script src="editor.js"></script>
  </body>
</html>
