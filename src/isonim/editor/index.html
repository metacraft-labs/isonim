<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IsoNim Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      /* CHRM-M3 Wave A — spec-pane TipTap typography.
        See isonim-examples/editor/index.html for the canonical comment. */
      [data-spec-pane-tiptap-host="true"] .ProseMirror {
        font-family:
          -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui,
          sans-serif;
        font-size: 14px;
        line-height: 1.6;
        color: #e8e9f0;
        max-width: 760px;
        /* Wave B: left-align via `margin: 0` instead of
          `margin: 0 auto`; see isonim-examples/editor/index.html
          for the canonical rationale. */
        margin: 0;
        padding-bottom: 32px;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror:focus {
        outline: none;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror > * + * {
        margin-top: 12px;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror h1 {
        font-size: 28px;
        font-weight: 700;
        line-height: 1.25;
        color: #f5f5f7;
        margin-top: 28px;
        margin-bottom: 8px;
        letter-spacing: -0.01em;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror h1:first-child {
        margin-top: 4px;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror h2 {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.3;
        color: #f5f5f7;
        margin-top: 24px;
        margin-bottom: 6px;
        letter-spacing: -0.005em;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror h3 {
        font-size: 16px;
        font-weight: 600;
        line-height: 1.4;
        color: #f5f5f7;
        margin-top: 20px;
        margin-bottom: 4px;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror p {
        font-size: 14px;
        line-height: 1.65;
        color: #d5d6db;
        margin-top: 8px;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror p:first-child {
        margin-top: 0;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror strong {
        font-weight: 600;
        color: #f5f5f7;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror em {
        font-style: italic;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror a {
        color: #8e8ee6;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror a:hover {
        color: #a8a8f0;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror code {
        font-family:
          ui-monospace, SFMono-Regular, "Menlo", "Consolas", monospace;
        font-size: 0.88em;
        background: #1d1d28;
        color: #c8c9d6;
        padding: 1px 6px;
        border-radius: 4px;
        border: 1px solid #2a2b36;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror pre {
        font-family:
          ui-monospace, SFMono-Regular, "Menlo", "Consolas", monospace;
        font-size: 12.5px;
        line-height: 1.55;
        background: #14141c;
        color: #d5d6db;
        padding: 12px 14px;
        border-radius: 6px;
        border: 1px solid #2a2b36;
        overflow-x: auto;
        margin-top: 12px;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror pre code {
        background: transparent;
        border: 0;
        padding: 0;
        font-size: inherit;
        color: inherit;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror blockquote {
        margin-top: 12px;
        padding: 4px 14px;
        border-left: 3px solid #4b4b6a;
        color: #a0a2b0;
        font-style: italic;
        background: rgba(255, 255, 255, 0.02);
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror blockquote p {
        color: #a0a2b0;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror ul,
      [data-spec-pane-tiptap-host="true"] .ProseMirror ol {
        padding-left: 24px;
        margin-top: 8px;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror li {
        margin-top: 4px;
        line-height: 1.6;
        color: #d5d6db;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror li > p {
        margin-top: 0;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror li > ul,
      [data-spec-pane-tiptap-host="true"] .ProseMirror li > ol {
        margin-top: 4px;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror hr {
        border: 0;
        border-top: 1px solid #2a2b36;
        margin: 24px 0;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror table {
        border-collapse: collapse;
        margin-top: 12px;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror th,
      [data-spec-pane-tiptap-host="true"] .ProseMirror td {
        border: 1px solid #2a2b36;
        padding: 6px 10px;
        text-align: left;
      }
      [data-spec-pane-tiptap-host="true"] .ProseMirror th {
        background: #1d1d28;
        font-weight: 600;
      }
      /* Wave B: align the CHRM-M4 formatting toolbar with the prose
        column below it. 760 px max-width matches the ProseMirror. */
      [data-spec-editor-toolbar="true"] {
        max-width: 760px;
      }

      [data-spec-pane-tiptap="true"]::-webkit-scrollbar {
        width: 10px;
      }
      [data-spec-pane-tiptap="true"]::-webkit-scrollbar-track {
        background: transparent;
      }
      [data-spec-pane-tiptap="true"]::-webkit-scrollbar-thumb {
        background: #2a2b36;
        border-radius: 6px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      [data-spec-pane-tiptap="true"]::-webkit-scrollbar-thumb:hover {
        background: #3a3b46;
        background-clip: padding-box;
        border: 2px solid transparent;
      }
    </style>
  </head>
  <body>
    <script src="fabric.min.js"></script>
    <script src="paper-core.min.js"></script>
    <script type="module" src="svgo.browser.js"></script>
    <script src="editor.js"></script>
  </body>
</html>
