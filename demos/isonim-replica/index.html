<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IsoNim M10 — Task Manager</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 600px;
        margin: 2rem auto;
      }
      .app {
        padding: 1rem;
      }
      .task-list {
        list-style: none;
        padding: 0;
      }
      .task-list li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.25rem 0;
      }
      .task-list li.completed span {
        text-decoration: line-through;
        color: #999;
      }
      .task-list li span {
        cursor: pointer;
      }
      .remove {
        background: none;
        border: none;
        color: red;
        cursor: pointer;
        font-size: 1.2rem;
      }
      .task-footer {
        display: flex;
        gap: 1rem;
        align-items: center;
        margin-top: 1rem;
        padding-top: 0.5rem;
        border-top: 1px solid #eee;
      }
      .filters {
        display: flex;
        gap: 0.25rem;
      }
      .filters button.selected {
        font-weight: bold;
        border-color: #333;
      }
      .task-detail {
        background: #f5f5f5;
        padding: 1rem;
        margin-top: 1rem;
        border-radius: 4px;
      }
      .effect-log {
        margin-top: 1rem;
        font-size: 0.875rem;
        color: #666;
      }
      .empty {
        color: #999;
        font-style: italic;
      }
      .error {
        color: red;
      }
      .loading {
        color: #999;
      }
      form {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }
      form input {
        flex: 1;
        padding: 0.5rem;
      }
      form button {
        padding: 0.5rem 1rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="dist/main.js"></script>
  </body>
</html>
