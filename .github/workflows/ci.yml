name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Nim ${{ matrix.nim-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nim-version: ["stable", "2.0.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run C backend tests
        run: just test-c

      - name: Run JS backend tests
        run: just test-js
