name: Benchmarks

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  size-benchmarks:
    name: Bundle Size Metrics
    # Single Linux Nix class: metric collection auto-pushes to the
    # gh-pages baseline, which must not race across parallel legs.
    runs-on: eph-linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build benchmark bundle
        run: nix develop --command just bench-build

      - name: Build demo bundle
        run: nix develop --command just demo-build

      - name: Build web components bundle
        run: nix develop --command just build-web-components

      - name: Collect size metrics
        run: nix develop --command ./scripts/collect-metrics.sh --sizes > benchmark-results.json

      - name: Show collected metrics
        run: cat benchmark-results.json

      - name: Store benchmark results
        if: github.ref == 'refs/heads/dev'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "IsoNim Bundle Sizes"
          tool: customSmallerIsBetter
          output-file-path: benchmark-results.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          alert-threshold: "120%"
          comment-on-alert: true
          fail-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test-counts:
    name: Test Count Metrics
    # Single Linux Nix class: metric collection auto-pushes to the
    # gh-pages baseline, which must not race across parallel legs.
    runs-on: eph-linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Collect test count metrics
        run: nix develop --command ./scripts/collect-metrics.sh --tests > test-count-results.json

      - name: Show collected metrics
        run: cat test-count-results.json

      - name: Store test count results
        if: github.ref == 'refs/heads/dev'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "IsoNim Test Counts"
          tool: customBiggerIsBetter
          output-file-path: test-count-results.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/tests
          auto-push: true
          alert-threshold: "80%"
          comment-on-alert: true
          fail-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
