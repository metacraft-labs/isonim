name: Benchmarks

# `bench-build` / `demo-build` / `build-web-components` all compile isonim, so
# they reach `src/isonim/core/platform.nim`'s `nim_everywhere/platform` import
# exactly the way ci.yml's test recipes do — and this workflow had no sibling
# provisioning either. It is provisioned the same way, through `setup-dev-env`.
#
# That change also retires the DeterminateSystems installer pair these jobs
# used. On the self-hosted `eph-*` classes it is what they were actually dying
# of, ahead of the sibling wall (run 33226741516, both jobs):
#
#   Error: Command failed: cat …/magic-nix-cache | xz -d | nix-store --import
#   Unable to locate executable file: determinate-nixd
#
# `env-flavor: nix` routes through `nixos-modules/.github/setup-nix`, which is
# what every other Nix job in this org runs on these runners.

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  size-benchmarks:
    name: Bundle Size Metrics
    # Single Linux Nix class: metric collection auto-pushes to the
    # gh-pages baseline, which must not race across parallel legs.
    runs-on: eph-linux-x64
    steps:
      # See ci.yml for why this is `secrets.` and not `vars.`.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}

      - name: Verify cross-repo siblings are provisioned
        run: dev-exec just check-siblings

      - name: Build benchmark bundle
        run: dev-exec just bench-build

      - name: Build demo bundle
        run: dev-exec just demo-build

      - name: Build web components bundle
        run: dev-exec just build-web-components

      - name: Collect size metrics
        run: dev-exec ./scripts/collect-metrics.sh --sizes > benchmark-results.json

      - name: Show collected metrics
        run: cat benchmark-results.json

      - name: Store benchmark results
        if: github.ref == 'refs/heads/dev'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "IsoNim Bundle Sizes"
          tool: customSmallerIsBetter
          output-file-path: benchmark-results.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          alert-threshold: "120%"
          comment-on-alert: true
          fail-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test-counts:
    name: Test Count Metrics
    # Single Linux Nix class: metric collection auto-pushes to the
    # gh-pages baseline, which must not race across parallel legs.
    runs-on: eph-linux-x64
    steps:
      # See ci.yml for why this is `secrets.` and not `vars.`.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}

      - name: Verify cross-repo siblings are provisioned
        run: dev-exec just check-siblings

      - name: Collect test count metrics
        run: dev-exec ./scripts/collect-metrics.sh --tests > test-count-results.json

      - name: Show collected metrics
        run: cat test-count-results.json

      - name: Store test count results
        if: github.ref == 'refs/heads/dev'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "IsoNim Test Counts"
          tool: customBiggerIsBetter
          output-file-path: test-count-results.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/tests
          auto-push: true
          alert-threshold: "80%"
          comment-on-alert: true
          fail-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
