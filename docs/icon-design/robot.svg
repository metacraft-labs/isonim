<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <!-- Simple robot head: rounded square body, two eye dots, short antenna.
       Designed to read as "robot" even at 14-16px while leaving the
       bottom-right corner clear for the status dot overlay. -->
  <!-- Antenna -->
  <path d="M12 3v2.5"/>
  <circle cx="12" cy="2.5" r="0.75" fill="currentColor" stroke="none"/>
  <!-- Head outline -->
  <rect x="4.5" y="6" width="15" height="12" rx="2.5"/>
  <!-- Eyes -->
  <circle cx="9" cy="12" r="1.25" fill="currentColor" stroke="none"/>
  <circle cx="15" cy="12" r="1.25" fill="currentColor" stroke="none"/>
</svg>
