<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <!-- History — clock face with a counter-clockwise rewind arrow at
       the top-left, marking "look backwards through time". The clock
       face proper has hour + minute hands. Monochrome silhouette via
       currentColor. Same style family as wrench / plus / etc. -->
  <!-- Arc of the clock face (open at the top-left so the rewind arrow
       can extend out of it). -->
  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
  <!-- The rewind arrowhead at the top-left of the clock — a short
       L-shape pointing into the arc's gap. -->
  <path d="M3 3v5h5"/>
  <!-- Clock hands — vertical hour hand + slightly shorter angled
       minute hand. -->
  <path d="M12 7v5l3.5 2"/>
</svg>
