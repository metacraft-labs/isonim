<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <!-- Cocoa = macOS native UI framework. The most recognisable macOS
       identifier is a window with the three traffic-light buttons
       (close / minimize / maximize) in the top-left corner. Monochrome
       silhouette so it inherits the chrome bar's currentColor. -->
  <!-- Window outline -->
  <rect x="3" y="5" width="18" height="14" rx="2"/>
  <!-- Title bar separator -->
  <line x1="3" y1="9" x2="21" y2="9"/>
  <!-- Three traffic-light buttons -->
  <circle cx="5.8" cy="7" r="0.8" fill="currentColor" stroke="none"/>
  <circle cx="8.2" cy="7" r="0.8" fill="currentColor" stroke="none"/>
  <circle cx="10.6" cy="7" r="0.8" fill="currentColor" stroke="none"/>
</svg>
